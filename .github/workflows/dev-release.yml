name: Dev release

on:
  push:
    branches: [custom-reaction, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore dev signing key
        env:
          DEV_KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: echo "$DEV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dev.jks"

      - name: Unit tests and release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/dev.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: dev
          SIGNING_KEY_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Publish rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" zalo-patch-dev.apk
          notes="Dev build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --notes "$notes" --target "$GITHUB_SHA"
            gh release upload dev zalo-patch-dev.apk --clobber
          else
            gh release create dev zalo-patch-dev.apk --prerelease --title "Dev build" \
              --notes "$notes" --target "$GITHUB_SHA"
          fi
